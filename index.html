<script>
const DEFAULT_CATEGORIES=[{id:'trabajo',name:'Trabajo',color:'#365F57'},{id:'auditoria',name:'Auditoría',color:'#E28D78'},{id:'formacion',name:'Formación',color:'#8E82B7'},{id:'inversiones',name:'Inversiones',color:'#E8A843'},{id:'gimnasio',name:'Gimnasio',color:'#78A083'},{id:'personal',name:'Personal',color:'#C98A9B'},{id:'viajes',name:'Viajes',color:'#5E8D8A'},{id:'compras',name:'Compras',color:'#B97A5B'}];
const DEFAULT_HABITS=[{id:'gym',name:'Entrenamiento',color:'#78A083'},{id:'steps',name:'10.000 pasos',color:'#E8A843'},{id:'study',name:'Formación',color:'#8E82B7'},{id:'read',name:'Lectura',color:'#E28D78'}];
const pad=n=>String(n).padStart(2,'0'), iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`, addDays=(d,n)=>{let x=new Date(d);x.setDate(x.getDate()+n);return x}, monday=d=>{let x=new Date(d),w=x.getDay()||7;x.setDate(x.getDate()-w+1);return x}, fmt=(d,o)=>new Intl.DateTimeFormat('es-ES',o).format(d);
const load=(k,f)=>{try{let v=localStorage.getItem(k);return v?JSON.parse(v):f}catch{return f}}, save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
let state={view:'Día',date:new Date(),dark:load('aurora_dark',false),categories:load('aurora_categories',DEFAULT_CATEGORIES),habits:load('aurora_habits',DEFAULT_HABITS),tasks:load('aurora_tasks',[]),trash:load('aurora_trash',[]),days:load('aurora_days',{}),weeklyGoals:load('aurora_weekly_goals',{}),momentum:load('aurora_momentum',{mode:'Discreta',mission:'priorities3',celebrated:{}}),query:''};
state.habits=state.habits.map(h=>({...h,frequency:h.frequency||'Diario',weekdays:Array.isArray(h.weekdays)?h.weekdays:[1,2,3,4,5,6,0],weeklyTarget:Number(h.weeklyTarget||7),unit:h.unit||'veces'}));
function rollover(){
  const today=iso(new Date());
  let changed=false;
  state.tasks=state.tasks.map(t=>{
    const pending=t.status!=='Completada';
    if(pending&&t.date&&t.date<today){
      changed=true;
      return {...t,date:today,carried:true,originalDate:t.originalDate||t.date,postponeCount:(t.postponeCount||0)+1,moveHistory:[...(t.moveHistory||[]),{from:t.date,to:today,at:new Date().toISOString(),reason:'continuidad automática'}]};
    }
    return t;
  });
  if(changed) persist();
  return changed;
}
function refreshForNewDay(){
  const changed=rollover();
  const actualToday=iso(new Date());
  const viewingOldToday=state.lastToday&&iso(state.date)===state.lastToday;
  if(viewingOldToday) state.date=new Date();
  state.lastToday=actualToday;
  if(changed||viewingOldToday) render();
}
function scheduleMidnightRefresh(){
  const now=new Date();
  const next=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1,0,0,2,0);
  clearTimeout(window.auroraMidnightTimer);
  window.auroraMidnightTimer=setTimeout(()=>{
    refreshForNewDay();
    scheduleMidnightRefresh();
  },Math.max(1000,next-now));
}
function persist(){save('aurora_dark',state.dark);save('aurora_categories',state.categories);save('aurora_habits',state.habits);save('aurora_tasks',state.tasks);save('aurora_trash',state.trash);save('aurora_days',state.days);save('aurora_weekly_goals',state.weeklyGoals);save('aurora_momentum',state.momentum)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function cmap(){return Object.fromEntries(state.categories.map(c=>[c.id,c]))}
const PRIORITY_ORDER={Alta:0,Media:1,Baja:2};function sortTasks(a,b){let p=(PRIORITY_ORDER[a.priority]??99)-(PRIORITY_ORDER[b.priority]??99);if(p)return p;let h=(a.time||'99:99').localeCompare(b.time||'99:99');return h||String(a.title||'').localeCompare(String(b.title||''),'es');}
function dayData(){let d=state.days[iso(state.date)]||{};return {priorities:d.priorities||['','',''],prioritiesDone:d.prioritiesDone||[false,false,false],goals:d.goals||'',notes:d.notes||'',habits:d.habits||{}}}
function taskWeight(task){return task.priority==='Alta'?3:task.priority==='Media'?2:1}
function momentumFor(date=state.date){let id=iso(date),d=state.days[id]||{},tasks=state.tasks.filter(t=>t.date===id&&!t.inbox),scheduled=state.habits.filter(h=>habitScheduled(h,date)),taskMax=tasks.reduce((s,t)=>s+taskWeight(t),0),taskDone=tasks.filter(t=>t.status==='Completada').reduce((s,t)=>s+taskWeight(t),0),habitDone=scheduled.filter(h=>d.habits&&d.habits[h.id]).length,max=taskMax+scheduled.length,earned=taskDone+habitDone,score=max?Math.min(100,Math.round(earned*100/max)):0;return{score,habitDone,habitMax:scheduled.length,taskDone,taskMax}}
function momentumStage(score){return score>=100?4:score>=75?3:score>=45?2:score>=20?1:0}
function togglePriorityLight(index){let d=dayData();d.prioritiesDone=d.prioritiesDone||[false,false,false];d.prioritiesDone[index]=!d.prioritiesDone[index];state.days[iso(state.date)]=d;persist();render()}
function momentumConsistency(){let active=0,success=0;for(let i=29;i>=0;i--){let d=addDays(new Date(),-i),m=momentumFor(d);if(m.taskMax||m.habitMax||m.lights){active++;if(m.score>=70)success++}}return active?Math.round(success*100/active):0}
function momentumRhythm(){let rhythm=0;for(let i=0;i<30;i++){let d=addDays(new Date(),-i),m=momentumFor(d);if(!(m.taskMax||m.habitMax||m.lights))continue;if(m.score>=70)rhythm++;else break}return rhythm}
function missionData(){let key=iso(monday(state.date)),mission=state.momentum.mission||'highPriority',dates=weekDates(state.date),done=0,target=3,title='Completa 3 tareas de prioridad alta';if(mission==='inbox0'){title='Deja el Inbox a cero';target=1;done=state.tasks.filter(t=>t.inbox).length===0?1:0}else if(mission==='reduceStuck'){title='Resuelve 2 tareas atascadas';target=2;done=state.tasks.filter(t=>t.status==='Completada'&&(t.postponeCount||0)>=3&&dates.map(iso).includes(t.date)).length}else{done=state.tasks.filter(t=>t.priority==='Alta'&&t.status==='Completada'&&dates.map(iso).includes(t.date)).length}return{key,mission,title,target,done,rate:Math.min(100,Math.round(done*100/target))}}
function chooseMission(value){state.momentum.mission=value;persist();render()}
function setMomentumMode(value){state.momentum.mode=value;persist();render()}
function stuckTasks(){return state.tasks.filter(t=>t.status!=='Completada'&&!t.inbox&&(t.postponeCount||0)>=3).sort((a,b)=>(b.postponeCount||0)-(a.postponeCount||0))}
function render(){document.documentElement.classList.toggle('dark',state.dark);let selected=iso(state.date), filtered=state.tasks.filter(t=>`${t.title||''} ${t.description||''}`.toLowerCase().includes(state.query.toLowerCase()));let tasks=filtered.filter(t=>t.date===selected&&!t.inbox).sort(sortTasks);let done=tasks.filter(t=>t.status==='Completada').length, progress=tasks.length?Math.round(done/tasks.length*100):0;
document.getElementById('app').innerHTML=`<header><div class="topbar"><div class="logo"><span class="sun"></span></div><div><div class="brand">Aurora</div><div class="tag">Tu día. Tu enfoque. Tu vida.</div></div><div class="spacer"></div><div class="seg">${['Día','Semana','Mes','Inbox','Revisión','Análisis','Papelera'].map(v=>`<button class="${state.view===v?'active':''}" onclick="setView('${v}')">${v}${v==='Inbox'&&state.tasks.filter(t=>t.inbox).length?' · '+state.tasks.filter(t=>t.inbox).length:''}</button>`).join('')}</div><button class="iconbtn" onclick="toggleDark()">${state.dark?'☀':'☾'}</button><button class="iconbtn" onclick="exportCSV()">⇩</button><button class="primary" onclick="openTask()">＋ Nueva tarea</button></div></header><div class="layout"><aside class="sidebar"><div style="display:flex;align-items:center"><span class="section-label">Categorías</span><button class="iconbtn" style="margin-left:auto" onclick="openSettings()">⚙</button></div><button class="manage" onclick="setView('Inbox')">Inbox · ${state.tasks.filter(t=>t.inbox).length}</button>${state.categories.map(c=>`<div class="cat-row"><span class="dot" style="background:${c.color}"></span><span>${esc(c.name)}</span><span class="count">${state.tasks.filter(t=>t.categoryId===c.id&&t.status!=='Completada').length}</span></div>`).join('')}<button class="manage" onclick="openSettings()">Gestionar categorías y hábitos</button><div class="info"><b>Continuidad automática</b><br>Las tareas pendientes pasan al día actual al abrir Aurora.</div></aside><main class="main"><div class="toolbar"><button onclick="navigate(-1)">‹</button><button onclick="today()">Hoy</button><button onclick="navigate(1)">›</button><div class="dateblock"><div class="date-title">${state.view==='Inbox'?'Bandeja de entrada':state.view==='Revisión'?'Revisión diaria':state.view==='Análisis'?'Análisis semanal':state.view==='Papelera'?'Papelera':state.view==='Mes'?fmt(state.date,{month:'long',year:'numeric'}):fmt(state.date,{weekday:'long',day:'numeric',month:'long'})}</div><div class="subtitle">${state.view==='Inbox'?'Captura ahora, organiza después':state.view==='Revisión'?'Cierra hoy y prepara mañana':state.view==='Análisis'?'Datos útiles para decidir mejor':state.view==='Papelera'?'Elementos eliminados recuperables':state.view==='Día'?'Tu espacio para hoy':state.view==='Semana'?'Planificación semanal':'Visión mensual'}</div></div><input class="search" placeholder="Buscar" value="${esc(state.query)}" oninput="searchTasks(this.value)"></div>${state.view==='Día'?renderDay(tasks,progress):state.view==='Semana'?renderWeek(filtered.filter(t=>!t.inbox)):state.view==='Mes'?renderMonth(filtered.filter(t=>!t.inbox)):state.view==='Inbox'?renderInbox(filtered.filter(t=>t.inbox).sort(sortTasks)):state.view==='Revisión'?renderReview():state.view==='Análisis'?renderAnalytics():renderTrash()}</main></div>`}
function renderDay(tasks,progress){let d=dayData(),cm=cmap(),momentum=momentumFor(state.date),stage=momentumStage(momentum.score),mission=missionData(),stuck=stuckTasks().slice(0,3),mode=state.momentum.mode||'Discreta';return `<div class="day-grid"><div class="stack">${mode==='Desactivada'?`<section class="progress" style="min-height:150px"><div style="font-size:11px;font-weight:800;text-transform:uppercase">Progreso diario</div><div class="progress-num">${progress}%</div><div class="bar"><span style="width:${progress}%"></span></div></section>`:`<section class="momentum-sky sky-${stage}"><div class="momentum-sun" style="bottom:${8+stage*16}px;opacity:${.25+stage*.18}"></div><div class="momentum-content"><div class="momentum-label">Momentum diario</div><div class="momentum-score">${momentum.score}%</div><div class="momentum-stage subtitle" style="color:rgba(255,255,255,.78)">${stage===4?'Pleno día':stage===3?'Claridad':stage===2?'Horizonte':stage===1?'Amanecer':'Primera luz'} · ${momentum.taskDone}/${momentum.taskMax} puntos de tareas · ${momentum.habitDone}/${momentum.habitMax} hábitos</div><div class="momentum-wide-bar"><div class="momentum-wide-fill" style="width:${momentum.score}%"></div></div></div></section>`}<section class="card"><div class="card-head">Tareas de hoy<button class="addsmall" onclick="openTask()">＋ Añadir</button></div><div class="card-body">${tasks.length?tasks.map(t=>`<div class="task ${t.status==='Completada'?'done':''}"><button class="check ${t.status==='Completada'?'done':''}" onclick="toggleTask('${t.id}')">${t.status==='Completada'?'✓':''}</button><div class="task-main" onclick="openTask('${t.id}')"><span class="task-title">${esc(t.title)}</span><span class="pill" style="background:${cm[t.categoryId]?.color||'#777'}">${esc(cm[t.categoryId]?.name||'Sin categoría')}</span>${t.carried?'<span class="pill" style="background:#b98b57">Arrastrada</span>':''}${t.postponeCount?'<span class="postpone-info">'+t.postponeCount+' aplazamiento'+(t.postponeCount===1?'':'s')+'</span>':''}${t.recurrence&&t.recurrence!=='No'?'<span class="recurring">↻ '+esc(t.recurrence)+'</span>':''}${t.subtasks?.length?'<span class="subtask-progress">'+t.subtasks.filter(s=>s.done).length+'/'+t.subtasks.length+' subtareas</span>':''}<div class="meta">${esc(t.description||'')}</div><div class="meta">${esc(t.time)} · ${t.duration} min · ${esc(t.priority)} · ${taskWeight(t)} puntos</div>${t.subtasks?.length?`<div class="subtasks-list" onclick="event.stopPropagation()">${t.subtasks.map((s,i)=>`<div class="subtask-item"><button class="subtask-check ${s.done?'on':''}" onclick="toggleSubtask(event,'${t.id}',${i})">${s.done?'✓':''}</button><span class="subtask-title ${s.done?'done':''}">${esc(s.title)}</span></div>`).join('')}</div>`:''}</div><button class="delete" onclick="deleteTask('${t.id}')">×</button></div>`).join(''):'<div class="empty">✓<br><b>Todo despejado</b><br>No hay tareas para este día.</div>'}</div></section><section class="card"><div class="card-head">Objetivos</div><div class="card-body"><textarea class="lined" placeholder="¿Qué quieres conseguir hoy?" onchange="setDayField('goals',this.value)">${esc(d.goals)}</textarea></div></section></div><div class="stack">${mode!=='Desactivada'?`<section class="card"><div class="card-head">Tu ritmo</div><div class="card-body"><div class="analytics-grid" style="grid-template-columns:1fr 1fr"><div class="analytics-card"><strong>${momentumRhythm()}</strong><span>Días de ritmo</span></div><div class="analytics-card"><strong>${momentumConsistency()}%</strong><span>Constancia 30 días</span></div></div></div></section><section class="card"><div class="card-head">Misión semanal</div><div class="card-body"><div class="mission"><strong>${esc(mission.title)}</strong><div class="meta">${mission.done}/${mission.target} completado</div><div class="mission-bar"><div class="mission-fill" style="width:${mission.rate}%"></div></div></div><select class="field" style="margin-top:10px" onchange="chooseMission(this.value)"><option value="highPriority" ${mission.mission==='highPriority'?'selected':''}>Completar 3 tareas de prioridad alta</option><option value="inbox0" ${mission.mission==='inbox0'?'selected':''}>Inbox a cero</option><option value="reduceStuck" ${mission.mission==='reduceStuck'?'selected':''}>Resolver tareas atascadas</option></select></div></section>`:''}<section class="card"><div class="card-head">Hábitos<button class="addsmall" onclick="openSettings('habits')">Editar</button></div><div class="card-body">${state.habits.map(h=>`<div class="habit ${d.habits[h.id]?'done':''}"><button class="check ${d.habits[h.id]?'done':''}" onclick="toggleHabit('${h.id}')">${d.habits[h.id]?'✓':''}</button><span class="dot" style="background:${h.color}"></span><span class="habit-name">${esc(h.name)}</span></div>`).join('')}</div></section>${mode==='Completa'&&stuck.length?`<section class="card"><div class="card-head">Tareas atascadas</div><div class="card-body">${stuck.map(t=>`<div class="stuck-card"><strong>${esc(t.title)}</strong><div class="meta">Lleva ${t.postponeCount} aplazamientos</div><button class="secondary" style="margin-top:7px" onclick="openTask('${t.id}')">Dividir o reorganizar</button></div>`).join('')}</div></section>`:''}<section class="card"><div class="card-head">Notas rápidas</div><div class="card-body"><textarea class="lined" style="min-height:260px" placeholder="Ideas, llamadas y asuntos pendientes..." onchange="setDayField('notes',this.value)">${esc(d.notes)}</textarea></div></section></div></div>`}

function renderInbox(tasks){let cm=cmap();return `<div class="inbox-list"><section class="card"><div class="card-head">Captura rápida</div><div class="card-body"><form class="inbox-capture" onsubmit="quickInbox(event)"><input name="title" class="field" required autofocus placeholder="Escribe una tarea y pulsa Enter"><button class="primary">Añadir al Inbox</button></form>${tasks.length?tasks.map(t=>`<div class="task"><button class="check" onclick="toggleTask('${t.id}')"></button><div class="task-main" onclick="openTask('${t.id}')"><span class="task-title">${esc(t.title)}</span><span class="badge-inbox">Inbox</span>${t.subtasks?.length?'<span class="subtask-progress">'+t.subtasks.filter(s=>s.done).length+'/'+t.subtasks.length+' subtareas</span>':''}<div class="meta">${esc(t.description||'Sin organizar')}</div>${t.subtasks?.length?`<div class="subtasks-list" onclick="event.stopPropagation()">${t.subtasks.map((s,i)=>`<div class="subtask-item"><button class="subtask-check ${s.done?'on':''}" onclick="toggleSubtask(event,'${t.id}',${i})">${s.done?'✓':''}</button><span class="subtask-title ${s.done?'done':''}">${esc(s.title)}</span></div>`).join('')}</div>`:''}</div><button class="delete" onclick="deleteTask('${t.id}')">×</button></div>`).join(''):'<div class="empty">Inbox vacío.<br><b>Captura una idea cuando aparezca.</b></div>'}</div></section></div>`}
function quickInbox(e){e.preventDefault();let title=new FormData(e.target).get('title').trim();if(!title)return;state.tasks.push({id:'task-'+Date.now(),title,description:'',date:'',time:'',duration:30,categoryId:state.categories[0]?.id||'',priority:'Media',status:'Pendiente',inbox:true,recurrence:'No',subtasks:[],carried:false});persist();render()}

function daysBetween(a,b){if(!a)return 0;return Math.max(0,Math.floor((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000))}
function renderReview(){let today=iso(new Date()),todayTasks=state.tasks.filter(t=>t.date===today&&!t.inbox),done=todayTasks.filter(t=>t.status==='Completada'),pending=todayTasks.filter(t=>t.status!=='Completada'),habits=dayData().habits||{},habitDone=state.habits.filter(h=>habits[h.id]).length;return `<div><div class="review-grid"><div class="metric"><strong>${done.length}</strong><span>Tareas completadas</span></div><div class="metric"><strong>${pending.length}</strong><span>Pendientes para mañana</span></div><div class="metric"><strong>${habitDone}/${state.habits.length}</strong><span>Hábitos cumplidos</span></div></div><section class="card"><div class="card-head">Pendientes de hoy</div><div class="card-body review-list">${pending.length?pending.sort(sortTasks).map(t=>`<div class="review-row"><span class="dot" style="background:${cmap()[t.categoryId]?.color||'#777'}"></span><strong>${esc(t.title)}</strong><span class="meta" style="margin-left:auto">${t.postponeCount||0} aplazamientos</span><button class="secondary" onclick="moveToTomorrow('${t.id}')">Pasar a mañana</button></div>`).join(''):'<div class="empty">No quedan tareas pendientes.</div>'}</div></section><section class="card" style="margin-top:18px"><div class="card-head">Preparar mañana</div><div class="card-body"><p class="subtitle">Selecciona las tres prioridades de mañana desde la vista del día siguiente.</p><button class="primary" onclick="openTomorrow()">Abrir mañana</button></div></section></div>`}
function moveToTomorrow(id){let tomorrow=iso(addDays(new Date(),1));state.tasks=state.tasks.map(t=>t.id===id?{...t,date:tomorrow,carried:true,postponeCount:(t.postponeCount||0)+1,moveHistory:[...(t.moveHistory||[]),{from:t.date,to:tomorrow,at:new Date().toISOString(),reason:'revisión diaria'}]}:t);persist();render()}
function openTomorrow(){state.date=addDays(new Date(),1);state.view='Día';render()}
function weekDates(base=state.date){let start=monday(base);return Array.from({length:7},(_,i)=>addDays(start,i))}
function habitScheduled(h,date){let day=date.getDay();return h.frequency==='Diario'||h.frequency==='Objetivo semanal'||(h.frequency==='Días concretos'&&(h.weekdays||[]).includes(day))}
function habitCompletedOn(h,date){let d=state.days[iso(date)];return !!(d&&d.habits&&d.habits[h.id])}
function habitWeekStats(h,base=state.date){let dates=weekDates(base),scheduled=dates.filter(d=>habitScheduled(h,d)),completed=scheduled.filter(d=>habitCompletedOn(h,d)).length,target=h.frequency==='Objetivo semanal'?Math.max(1,Number(h.weeklyTarget||1)):Math.max(1,scheduled.length);return{completed,target,rate:Math.min(100,Math.round(completed*100/target))}}
function habitStreak(h){let streak=0,best=0,current=0;for(let i=180;i>=0;i--){let d=addDays(new Date(),-i);if(!habitScheduled(h,d))continue;if(habitCompletedOn(h,d)){current++;best=Math.max(best,current)}else current=0}for(let i=0;i<180;i++){let d=addDays(new Date(),-i);if(!habitScheduled(h,d))continue;if(habitCompletedOn(h,d))streak++;else break}return{streak,best}}
function weeklyTaskStats(base=state.date){let dates=weekDates(base),ids=dates.map(iso),items=state.tasks.filter(t=>ids.includes(t.date)&&!t.inbox),done=items.filter(t=>t.status==='Completada'),planned=items.reduce((s,t)=>s+Number(t.duration||0),0),postponed=items.reduce((s,t)=>s+Number(t.postponeCount||0),0);return{dates,items,done,planned,postponed,rate:items.length?Math.round(done.length*100/items.length):0}}
function renderAnalytics(){let stats=weeklyTaskStats(),cm=cmap(),maxDay=Math.max(1,...stats.dates.map(d=>state.tasks.filter(t=>t.date===iso(d)&&!t.inbox).length)),byCategory=state.categories.map(c=>({c,minutes:stats.items.filter(t=>t.categoryId===c.id).reduce((s,t)=>s+Number(t.duration||0),0)})).filter(x=>x.minutes),maxCat=Math.max(1,...byCategory.map(x=>x.minutes)),weekKey=iso(monday(state.date)),weeklyGoal=(state.weeklyGoals||{})[weekKey]||'';return `<div><div class="analytics-grid"><div class="analytics-card"><strong>${stats.rate}%</strong><span>Cumplimiento semanal</span></div><div class="analytics-card"><strong>${stats.done.length}/${stats.items.length}</strong><span>Tareas completadas</span></div><div class="analytics-card"><strong>${Math.round(stats.planned/6)/10} h</strong><span>Tiempo planificado</span></div><div class="analytics-card"><strong>${stats.postponed}</strong><span>Aplazamientos acumulados</span></div></div><div class="day-grid"><div class="stack"><section class="card"><div class="card-head">Carga por día</div><div class="card-body"><div class="chart">${stats.dates.map(d=>{let n=state.tasks.filter(t=>t.date===iso(d)&&!t.inbox).length;return `<div class="chart-col"><div class="chart-bar" style="height:${Math.max(3,n/maxDay*100)}%"></div><span class="chart-label">${fmt(d,{weekday:'short'})}<br>${n}</span></div>`}).join('')}</div></div></section><section class="card"><div class="card-head">Tiempo por categoría</div><div class="card-body">${byCategory.length?byCategory.sort((a,b)=>b.minutes-a.minutes).map(x=>`<div class="category-bar"><span><i class="dot" style="display:inline-block;background:${x.c.color};margin-right:7px"></i>${esc(x.c.name)}</span><div class="category-track"><div class="category-fill" style="width:${x.minutes/maxCat*100}%;background:${x.c.color}"></div></div><strong>${Math.round(x.minutes/6)/10}h</strong></div>`).join(''):'<div class="empty">No hay tiempo planificado esta semana.</div>'}</div></section></div><div class="stack"><section class="card"><div class="card-head">Hábitos esta semana</div><div class="card-body">${state.habits.map(h=>{let x=habitWeekStats(h),r=habitStreak(h);return `<div class="habit-stat"><div class="habit-stat-top"><i class="dot" style="background:${h.color}"></i><strong>${esc(h.name)}</strong><span class="count">${x.completed}/${x.target}</span></div><div class="meta">Racha actual: ${r.streak} · Mejor: ${r.best}</div><div class="habit-track"><div class="habit-fill" style="width:${x.rate}%;background:${h.color}"></div></div></div>`}).join('')}</div></section><section class="card"><div class="card-head">Objetivo semanal</div><div class="card-body"><textarea class="week-goal" placeholder="¿Qué quieres conseguir esta semana?" onchange="setWeeklyGoal('${weekKey}',this.value)">${esc(weeklyGoal)}</textarea></div></section></div></div></div>`}
function setWeeklyGoal(key,value){state.weeklyGoals=state.weeklyGoals||{};state.weeklyGoals[key]=value;save('aurora_weekly_goals',state.weeklyGoals)}

function renderTrash(){return `<div><section class="card"><div class="card-head">Papelera <span class="count">${state.trash.length}</span><div class="trash-actions"><button class="secondary" onclick="emptyTrash()">Vaciar</button></div></div><div class="card-body">${state.trash.length?state.trash.slice().sort((a,b)=>String(b.deletedAt).localeCompare(String(a.deletedAt))).map(t=>`<div class="task"><div class="task-main"><strong>${esc(t.title)}</strong><div class="meta">Eliminada ${t.deletedAt?new Date(t.deletedAt).toLocaleString('es-ES'):''}</div></div><button class="secondary" onclick="restoreTask('${t.id}')">Restaurar</button><button class="delete" onclick="destroyTask('${t.id}')">×</button></div>`).join(''):'<div class="empty">La papelera está vacía.</div>'}</div></section></div>`}
function restoreTask(id){let task=state.trash.find(t=>t.id===id);if(task){let {deletedAt,...rest}=task;state.tasks.push(rest)}state.trash=state.trash.filter(t=>t.id!==id);persist();render()}
function destroyTask(id){if(confirm('¿Eliminar definitivamente?')){state.trash=state.trash.filter(t=>t.id!==id);persist();render()}}
function emptyTrash(){if(state.trash.length&&confirm('¿Vaciar definitivamente la papelera?')){state.trash=[];persist();render()}}
function purgeOldTrash(){let limit=Date.now()-30*86400000;state.trash=state.trash.filter(t=>!t.deletedAt||new Date(t.deletedAt).getTime()>limit);persist()}

function renderWeek(tasks){let cm=cmap(),days=Array.from({length:7},(_,i)=>addDays(monday(state.date),i));return `<div class="week">${days.map(d=>{let id=iso(d);return `<div class="week-day" ondragover="event.preventDefault()" ondrop="moveTask(event,'${id}')"><button class="dayhead" onclick="selectDay('${id}')"><div class="subtitle">${fmt(d,{weekday:'short'})}</div><div class="daynum">${d.getDate()}</div></button>${tasks.filter(t=>t.date===id).sort(sortTasks).map(t=>`<div class="mini-task" draggable="true" ondragstart="event.dataTransfer.setData('task','${t.id}')" style="border-color:${cm[t.categoryId]?.color||'#777'}"><b>${esc(t.title)}</b><br><span class="subtitle">${esc(t.time)}</span></div>`).join('')}</div>`}).join('')}</div>`}
function renderMonth(tasks){let cm=cmap(),start=monday(new Date(state.date.getFullYear(),state.date.getMonth(),1)),days=Array.from({length:42},(_,i)=>addDays(start,i));return `<div class="month">${['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(x=>`<div class="month-head">${x}</div>`).join('')}${days.map(d=>`<div class="month-day ${d.getMonth()!==state.date.getMonth()?'outside':''}" onclick="selectDay('${iso(d)}')"><b>${d.getDate()}</b>${tasks.filter(t=>t.date===iso(d)).sort(sortTasks).slice(0,3).map(t=>`<div class="mini-task" style="border-color:${cm[t.categoryId]?.color||'#777'}">${esc(t.time)} ${esc(t.title)}</div>`).join('')}</div>`).join('')}</div>`}
function setView(v){state.view=v;render()}function navigate(n){let d=new Date(state.date);state.view==='Mes'?d.setMonth(d.getMonth()+n):d.setDate(d.getDate()+n*(state.view==='Semana'?7:1));state.date=d;render()}function today(){state.date=new Date();render()}function selectDay(s){state.date=new Date(s+'T12:00:00');state.view='Día';render()}function searchTasks(v){state.query=v;render()}function toggleDark(){state.dark=!state.dark;persist();render()}
function setPriority(i,v){let d=dayData();d.priorities[i]=v;state.days[iso(state.date)]=d;persist()}function setDayField(k,v){let d=dayData();d[k]=v;state.days[iso(state.date)]=d;persist()}function toggleHabit(id){let d=dayData();d.habits[id]=!d.habits[id];state.days[iso(state.date)]=d;persist();render()}function toggleSubtask(event,taskId,index){event.stopPropagation();state.tasks=state.tasks.map(t=>{if(t.id!==taskId)return t;let subtasks=(t.subtasks||[]).map((s,i)=>i===index?{...s,done:!s.done}:s);return {...t,subtasks};});persist();render()}
function nextRecurringDate(task){let d=new Date((task.date||iso(new Date()))+'T12:00:00');if(task.recurrence==='Diaria')d.setDate(d.getDate()+1);else if(task.recurrence==='Días laborables'){do{d.setDate(d.getDate()+1)}while(d.getDay()===0||d.getDay()===6)}else if(task.recurrence==='Semanal')d.setDate(d.getDate()+7);else if(task.recurrence==='Cada 2 semanas')d.setDate(d.getDate()+14);else if(task.recurrence==='Mensual')d.setMonth(d.getMonth()+1);else if(task.recurrence==='Trimestral')d.setMonth(d.getMonth()+3);else if(task.recurrence==='Anual')d.setFullYear(d.getFullYear()+1);else return '';return iso(d)}
function toggleTask(id){let source=state.tasks.find(t=>t.id===id),completing=source&&source.status!=='Completada';state.tasks=state.tasks.map(t=>t.id===id?{...t,status:completing?'Completada':'Pendiente'}:t);if(completing&&source.recurrence&&source.recurrence!=='No'){let next=nextRecurringDate(source);if(next&&!state.tasks.some(t=>t.recurrenceParent===source.id&&t.date===next)){state.tasks.push({...source,id:'task-'+Date.now(),date:next,status:'Pendiente',carried:false,inbox:false,recurrenceParent:source.id,subtasks:(source.subtasks||[]).map(s=>({...s,done:false}))})}}persist();render()}function deleteTask(id){if(confirm('¿Mover esta tarea a la papelera?')){let task=state.tasks.find(t=>t.id===id);if(task)state.trash.push({...task,deletedAt:new Date().toISOString()});state.tasks=state.tasks.filter(t=>t.id!==id);persist();render()}}function moveTask(e,date){let id=e.dataTransfer.getData('task');state.tasks=state.tasks.map(t=>t.id===id?{...t,date,carried:false}:t);persist();render()}
function openTask(id){let t=state.tasks.find(x=>x.id===id),f=t||{title:'',description:'',date:iso(state.date),time:'09:00',duration:30,categoryId:state.categories[0]?.id||'',priority:'Media',status:'Pendiente',inbox:false,recurrence:'No',subtasks:[]};showModal(`<div class="modalhead"><div><h2>${t?'Editar tarea':'Nueva tarea'}</h2><div class="subtitle">Simple por fuera, potente por dentro.</div></div><button class="iconbtn" onclick="closeModal()">×</button></div><form onsubmit="saveTaskForm(event,'${t?.id||''}')"><div class="fields"><input name="title" class="field" required autofocus placeholder="Título" value="${esc(f.title)}"><textarea name="description" class="field" placeholder="Descripción">${esc(f.description||'')}</textarea><div class="cols"><input name="date" type="date" class="field" value="${f.date||iso(state.date)}"><input name="time" type="time" class="field" value="${f.time||'09:00'}"><select name="duration" class="field">${[30,60,90,120,180,240].map(v=>`<option ${f.duration==v?'selected':''}>${v}</option>`).join('')}</select></div><div class="cols"><select name="categoryId" class="field">${state.categories.map(c=>`<option value="${c.id}" ${f.categoryId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select><select name="priority" class="field">${['Alta','Media','Baja'].map(v=>`<option ${f.priority===v?'selected':''}>${v}</option>`).join('')}</select><select name="status" class="field">${['Pendiente','En curso','Completada','Aplazada'].map(v=>`<option ${f.status===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="advanced"><label><input name="inbox" type="checkbox" ${f.inbox?'checked':''}> Mantener en Inbox</label><div class="cols" style="margin-top:10px"><select name="recurrence" class="field"><option>No</option>${['Diaria','Días laborables','Semanal','Cada 2 semanas','Mensual','Trimestral','Anual'].map(v=>`<option ${f.recurrence===v?'selected':''}>${v}</option>`).join('')}</select><textarea name="subtasks" class="field" style="grid-column:span 2;min-height:82px" placeholder="Subtareas, una por línea">${esc((f.subtasks||[]).map(s=>s.title).join(String.fromCharCode(10)))}</textarea></div></div></div><div class="modal-actions"><button type="button" class="iconbtn" onclick="closeModal()">Cancelar</button><button class="primary">Guardar</button></div></form>`)}
function saveTaskForm(e,id){e.preventDefault();let fd=new FormData(e.target),obj=Object.fromEntries(fd.entries()),old=id?state.tasks.find(t=>t.id===id):null;obj.duration=Number(obj.duration);obj.inbox=fd.has('inbox');obj.subtasks=String(obj.subtasks||'').split(String.fromCharCode(10)).map(x=>x.trim()).filter(Boolean).map((title,i)=>({id:(old?.subtasks?.[i]?.id)||'sub-'+Date.now()+'-'+i,title,done:old?.subtasks?.[i]?.title===title?old.subtasks[i].done:false}));if(obj.inbox)obj.date='';if(id)obj={...old,...obj};else obj={...obj,id:'task-'+Date.now(),carried:false};state.tasks=id?state.tasks.map(t=>t.id===id?obj:t):[...state.tasks,obj];persist();closeModal();render()}

function openSettings(tab='categories'){showModal(`<div class="modalhead"><div><h2>Ajustes de Aurora</h2><div class="subtitle">Personaliza categorías y hábitos.</div></div><button class="iconbtn" onclick="closeModal()">×</button></div><h3>Categorías</h3><form class="cols" onsubmit="addCategory(event)"><input name="name" class="field" required placeholder="Nueva categoría"><input name="color" type="color" class="field" value="#E28D78"><button class="primary">Añadir</button></form><div>${state.categories.map(c=>`<div class="habit-edit"><input type="color" value="${c.color}" onchange="editCategory('${c.id}','color',this.value)"><input class="field" value="${esc(c.name)}" onchange="editCategory('${c.id}','name',this.value)"><button class="delete" onclick="removeCategory('${c.id}')">×</button></div>`).join('')}</div><h3 style="margin-top:26px">Hábitos</h3><form class="cols" onsubmit="addHabit(event)"><input name="name" class="field" required placeholder="Nuevo hábito"><input name="color" type="color" class="field" value="#78A083"><select name="frequency" class="field"><option>Diario</option><option>Días concretos</option><option>Objetivo semanal</option></select><input name="weeklyTarget" type="number" min="1" max="7" class="field" value="7" placeholder="Objetivo semanal"><input name="unit" class="field" value="veces" placeholder="Unidad"><button class="primary">Añadir</button></form><div>${state.habits.map(h=>`<div class="habit-config"><div class="habit-edit"><input type="color" value="${h.color}" onchange="editHabit('${h.id}','color',this.value)"><input class="field" value="${esc(h.name)}" onchange="editHabit('${h.id}','name',this.value)"><button class="delete" onclick="removeHabit('${h.id}')">×</button></div><div class="cols" style="margin-top:8px"><select class="field" onchange="editHabit('${h.id}','frequency',this.value)">${['Diario','Días concretos','Objetivo semanal'].map(v=>`<option ${h.frequency===v?'selected':''}>${v}</option>`).join('')}</select><input class="field" type="number" min="1" max="7" value="${h.weeklyTarget||7}" onchange="editHabit('${h.id}','weeklyTarget',Number(this.value))"><input class="field" value="${esc(h.unit||'veces')}" onchange="editHabit('${h.id}','unit',this.value)"></div><div class="weekday-pills" style="margin-top:8px">${[['L',1],['M',2],['X',3],['J',4],['V',5],['S',6],['D',0]].map(([n,d])=>`<label class="weekday-pill"><input type="checkbox" ${h.weekdays?.includes(d)?'checked':''} onchange="toggleHabitWeekday('${h.id}',${d},this.checked)"><span>${n}</span></label>`).join('')}</div></div>`).join('')}</div><h3 style="margin-top:26px">Momentum</h3><p class="subtitle">Elige cuánto quieres ver la gamificación de Aurora.</p>${['Desactivada','Discreta','Completa'].map(v=>`<label class="mode-option"><input type="radio" name="momentumMode" value="${v}" ${state.momentum.mode===v?'checked':''} onchange="setMomentumMode(this.value)"><span><strong>${v}</strong><br><small>${v==='Desactivada'?'Solo progreso funcional':v==='Discreta'?'Amanecer, ritmo y misión':'Incluye también tareas atascadas y feedback completo'}</small></span></label>`).join('')}<h3 style="margin-top:26px">Copia de seguridad</h3><div class="backup-grid"><button class="iconbtn" onclick="exportBackup()">Exportar copia completa</button><button class="iconbtn" onclick="document.getElementById('backupFile').click()">Importar copia</button></div><input id="backupFile" class="file-input" type="file" accept="application/json,.json" onchange="importBackup(this.files[0])"><div class="modal-actions"><button class="primary" onclick="closeModal();render()">Cerrar</button></div>`)}
function addCategory(e){e.preventDefault();let f=new FormData(e.target),name=f.get('name').trim();if(state.categories.some(c=>c.name.toLowerCase()===name.toLowerCase()))return alert('La categoría ya existe.');state.categories.push({id:'cat-'+Date.now(),name,color:f.get('color')});persist();openSettings()}function editCategory(id,k,v){state.categories=state.categories.map(c=>c.id===id?{...c,[k]:v}:c);persist()}function removeCategory(id){if(state.tasks.some(t=>t.categoryId===id))return alert('No puedes eliminar una categoría con tareas asociadas.');if(state.categories.length===1)return alert('Debe quedar al menos una categoría.');state.categories=state.categories.filter(c=>c.id!==id);persist();openSettings()}
function addHabit(e){e.preventDefault();let f=new FormData(e.target),name=f.get('name').trim();if(state.habits.some(h=>h.name.toLowerCase()===name.toLowerCase()))return alert('El hábito ya existe.');state.habits.push({id:'habit-'+Date.now(),name,color:f.get('color'),frequency:f.get('frequency')||'Diario',weekdays:[1,2,3,4,5,6,0],weeklyTarget:Number(f.get('weeklyTarget')||7),unit:f.get('unit')||'veces'});persist();openSettings()}function editHabit(id,k,v){state.habits=state.habits.map(h=>h.id===id?{...h,[k]:v}:h);persist()}function toggleHabitWeekday(id,day,checked){state.habits=state.habits.map(h=>{if(h.id!==id)return h;let weekdays=[...(h.weekdays||[])];if(checked&&!weekdays.includes(day))weekdays.push(day);if(!checked)weekdays=weekdays.filter(x=>x!==day);return{...h,weekdays}});persist()}function removeHabit(id){state.habits=state.habits.filter(h=>h.id!==id);Object.values(state.days).forEach(d=>{if(d.habits)delete d.habits[id]});persist();openSettings()}
function exportBackup(){let data={app:'Aurora',version:2.3,exportedAt:new Date().toISOString(),categories:state.categories,habits:state.habits,tasks:state.tasks,trash:state.trash,days:state.days,weeklyGoals:state.weeklyGoals,momentum:state.momentum,dark:state.dark};let url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='aurora-copia-'+iso(new Date())+'.json';a.click();URL.revokeObjectURL(url)}
function importBackup(file){if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let data=JSON.parse(reader.result);if(data.app!=='Aurora'||!Array.isArray(data.tasks)||!Array.isArray(data.categories))throw new Error('Formato no válido');if(!confirm('La copia sustituirá los datos actuales. ¿Continuar?'))return;state.categories=data.categories;state.habits=Array.isArray(data.habits)?data.habits:state.habits;state.tasks=data.tasks;state.trash=Array.isArray(data.trash)?data.trash:[];state.days=data.days||{};state.weeklyGoals=data.weeklyGoals||{};state.momentum=data.momentum||state.momentum;state.dark=!!data.dark;persist();closeModal();render();alert('Copia restaurada correctamente.')}catch(err){alert('No se pudo importar la copia: '+err.message)}};reader.readAsText(file)}

function showModal(content){let wrap=document.createElement('div');wrap.id='modal';wrap.className='modalback';wrap.innerHTML=`<div class="modal">${content}</div>`;document.body.appendChild(wrap)}function closeModal(){document.getElementById('modal')?.remove()}
function exportCSV(){let cm=cmap(),q=v=>'"'+String(v??'').split('"').join('""')+'"',rows=[['Título','Descripción','Fecha','Hora','Duración','Categoría','Prioridad','Estado'],...state.tasks.map(t=>[t.title,t.description,t.date,t.time,t.duration,cm[t.categoryId]?.name||'',t.priority,t.status])],csv=String.fromCharCode(65279)+rows.map(r=>r.map(q).join(',')).join(String.fromCharCode(13,10)),url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=`aurora-${iso(new Date())}.csv`;a.click();URL.revokeObjectURL(url)}
purgeOldTrash();
state.lastToday=iso(new Date());
rollover();
render();
scheduleMidnightRefresh();
setInterval(refreshForNewDay,60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshForNewDay()});
window.addEventListener('focus',refreshForNewDay);
window.addEventListener('pageshow',refreshForNewDay);
</script>
